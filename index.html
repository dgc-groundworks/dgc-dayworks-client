<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGC Dayworks — Dandara</title>
<link rel="icon" href="dgc-logo-dark.png">
<script src="config.js"></script>
<style>
:root{
  --bg:#eef2f7;--surf:#ffffff;--surf2:#f3f6fa;--bord:#d6dfe8;
  --navy:#1a2a3f;--navy2:#243552;--text:#1a2b3c;--muted:#5c7a94;
  --accent:#e08a00;--green:#16a34a;--red:#b91c1c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;overflow-x:hidden}

.lh-bar{background:var(--navy);color:#fff;padding:18px 28px;display:flex;align-items:center;gap:18px}
.lh-bar img{height:46px;width:auto}
.lh-bar .lh-text{line-height:1.4}
.lh-bar .lh-company{font-size:1.05rem;font-weight:800;letter-spacing:-.2px}
.lh-bar .lh-addr{font-size:0.76rem;opacity:.75}
.lh-bar .lh-sub{margin-left:auto;text-align:right;font-size:0.8rem;opacity:.85}

.main{max-width:1000px;margin:0 auto;padding:28px 20px 60px}

.brief{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:22px 26px;margin-bottom:26px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.brief h1{font-size:1.25rem;font-weight:800;color:var(--navy);margin-bottom:8px}
.brief p{color:var(--muted);line-height:1.6;font-size:0.9rem;max-width:640px}
.brief .brief-totals{margin-top:16px;display:flex;gap:30px;flex-wrap:wrap}
.brief .bt-block{display:flex;flex-direction:column;gap:3px}
.brief .bt-label{font-size:0.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.brief .bt-amount{font-size:1.5rem;font-weight:900;color:var(--navy)}
.brief .bt-amount-due{color:var(--accent)}
.brief .bt-sub{color:var(--muted);font-size:0.78rem}
.brief .brief-meta{font-size:0.76rem;color:var(--muted);margin-top:14px}

.crumb{display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:0.85rem;color:var(--muted)}
.crumb button{background:none;border:none;color:var(--navy);font-weight:700;cursor:pointer;font-family:inherit;font-size:0.85rem;padding:0}
.crumb .sep{color:var(--muted)}
.back-inline{display:inline-flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--bord);border-radius:7px;padding:8px 16px;color:var(--text);font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:16px}
.back-inline:hover{border-color:var(--navy)}

.empty-state{padding:60px 20px;text-align:center;color:var(--muted)}

.overview-section{margin-bottom:22px}
.overview-hdr{display:flex;align-items:center;gap:8px;font-weight:800;font-size:0.95rem;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);margin-bottom:10px}
.overview-hdr .oh-hours{margin-left:auto;color:var(--muted);font-size:0.8rem;font-weight:700;text-transform:none;letter-spacing:0}
.overview-table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--bord);border-radius:10px;overflow:hidden;table-layout:fixed;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.overview-table th{text-align:left;padding:10px 16px;font-size:0.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--bord);background:var(--surf2)}
.overview-table td{padding:12px 16px;border-bottom:1px solid var(--bord);font-size:0.9rem}
.overview-table tr:last-child td{border-bottom:none}
.overview-row{cursor:pointer;transition:background .15s}
.overview-row:hover td{background:var(--surf2)}
.overview-row .or-amount{font-weight:800;color:var(--navy)}
.overview-total-row td{font-weight:900;font-size:1rem;background:var(--surf2);border-bottom:none}
.overview-total-row .or-amount{color:var(--navy)}

.person-head{background:var(--surf);border:1px solid var(--bord);border-radius:12px;padding:20px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.person-head h2{font-size:1.2rem;font-weight:800;color:var(--navy)}
.person-head .ph-range{color:var(--muted);font-size:0.85rem;margin-top:4px}
.person-head .ph-total{margin-top:12px;text-align:right;font-weight:900;font-size:1.1rem;color:var(--navy)}

.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.week-nav button{background:var(--surf);border:1px solid var(--bord);border-radius:7px;color:var(--text);padding:8px 16px;cursor:pointer;font-family:inherit;font-weight:700}
.week-nav button:disabled{opacity:.35;cursor:default}
.week-nav .wn-label{font-weight:800;flex:1;text-align:center;color:var(--navy)}
.week-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:800px){.week-grid{grid-template-columns:1fr}}
.week-photos img{width:100%;border-radius:8px;border:1px solid var(--bord);margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

.hrs-table{width:100%;border-collapse:collapse;background:var(--surf);border:1px solid var(--bord);border-radius:10px;overflow:hidden;table-layout:fixed;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hrs-table th{text-align:left;padding:9px 12px;font-size:0.65rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--bord);background:var(--surf2)}
.hrs-table td{padding:9px 12px;font-size:0.82rem;border-bottom:1px solid var(--bord);word-wrap:break-word}
.hrs-table tr:last-child td{border-bottom:none}
.hrs-total-row td{font-weight:800;background:var(--surf2)}
.day-actions{padding:8px 12px 12px;border-top:none}
.btn-query{background:none;border:1px solid var(--bord);color:var(--muted);padding:5px 12px;border-radius:6px;font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-query:hover{border-color:var(--red);color:var(--red)}

.approved-note{margin-top:12px;font-size:0.78rem;color:var(--muted);text-align:right}
.approved-note strong{color:var(--green)}

.query-form{background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:14px 16px;margin:10px 0;font-size:0.82rem}
.query-form label{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;color:var(--muted);font-size:0.72rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.query-form input,.query-form textarea{background:#fff;border:1px solid var(--bord);border-radius:6px;padding:8px 10px;color:var(--text);font-size:0.85rem;font-family:inherit;width:100%}
.query-form textarea{min-height:70px;resize:vertical}
.query-form .qf-actions{display:flex;gap:8px;margin-top:6px}
.btn-primary{background:var(--navy);color:#fff;border:none;padding:9px 18px;border-radius:6px;font-size:0.85rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary:disabled{opacity:.5;cursor:default}
.btn-secondary{background:none;border:1px solid var(--bord);color:var(--muted);padding:9px 18px;border-radius:6px;font-size:0.85rem;cursor:pointer;font-family:inherit}
.qf-status{font-size:0.78rem;margin-top:8px}

.footer-note{text-align:center;color:var(--muted);font-size:0.76rem;margin-top:40px;line-height:1.6}
</style>
</head>
<body>
<div class="lh-bar">
  <img src="dgc-logo-dark.png" alt="DGC">
  <div class="lh-text">
    <div class="lh-company">Drainage &amp; Groundwork Contractors Limited</div>
    <div class="lh-addr">23 Circular Road, Douglas, Isle of Man, IM1 1AF</div>
  </div>
  <div class="lh-sub">Dayworks — Hours &amp; Evidence</div>
</div>
<main class="main" id="mainArea">
  <p class="empty-state">Loading…</p>
</main>

<script>
// ---------------------------------------------------------------
// DGC Dayworks — client-facing site (Dandara). Read-only.
//
// This page never talks to the internal dgc_dayworks_entries table
// directly — it only ever calls the dayworks-client-data Edge Function,
// which runs server-side with the service-role key and only ever returns
// rows that are sent + approved + confirmed + not flagged. There is no
// credential on this page capable of reading anything else — not other
// jobs' internal drafts, not DGC's other apps, nothing beyond what's
// already been approved for this client to see.
//
// The only direct table access from this page is INSERT-only into
// dgc_dayworks_queries (submitting a query about an entry) — a
// low-sensitivity table with no read-back of other people's queries.
// ---------------------------------------------------------------
const RATE = 29; // DGC's dayworks rate charged to Dandara, £/hr
const DATA_FN = SUPABASE_URL + '/functions/v1/dayworks-client-data';
const QUERIES_REST = SUPABASE_URL + '/rest/v1/dgc_dayworks_queries';

function sbHeaders(extra) {
  return Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, extra || {});
}
function esc(s) { return (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtDate(iso) { return iso ? iso.split('-').reverse().join('/') : '—'; }
function fmtMoney(n) { return '£' + n.toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function getMonday(iso) {
  const d = new Date(iso + 'T12:00:00');
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return d.toISOString().slice(0, 10);
}
function baseJob(site) {
  const s = (site || '').trim();
  if (!s) return '(Job not set)';
  if (/ballasalla/i.test(s)) return 'Ballasalla';
  if (/quay west/i.test(s)) return 'Quay West';
  return s;
}
function jobDescription(site) {
  let s = (site || '').trim();
  s = s.replace(/ballasalla/gi, '').replace(/quay west/gi, '');
  s = s.replace(/^[\s\-+()]+|[\s\-+()]+$/g, '').trim();
  return s;
}

let entries = [];
let totalPaid = 0;
let state = { job: null, name: null, weekIndex: 0 };

async function loadEntries() {
  const r = await fetch(DATA_FN, { headers: sbHeaders() });
  if (!r.ok) throw new Error(await r.text());
  const data = await r.json();
  entries = (data.rows || data.entries || []);
  totalPaid = data.totalPaid || 0;
}

function render() {
  const main = document.getElementById('mainArea');
  if (!state.job) return renderOverview(main);
  if (!state.name) return renderOverview(main); // names live inside the same overview per job
  renderPerson(main);
}

function briefHtml() {
  const allTimeHours = entries.reduce((s, e) => s + (e.hours || 0), 0);
  const allTimeAmount = allTimeHours * RATE;
  const dueAmount = Math.max(0, allTimeAmount - totalPaid);
  const dates = entries.map(e => e.date).filter(Boolean).sort();
  const latest = dates.length ? fmtDate(dates[dates.length - 1]) : '—';
  const todayStr = fmtDate(new Date().toISOString().slice(0, 10));
  return `
    <div class="brief">
      <h1>Dayworks Hours — Ballasalla &amp; Quay West</h1>
      <p>This page shows dayworks hours approved by Drainage &amp; Groundwork Contractors Ltd, ready for your review. It updates automatically as new weeks are approved — no need to check back on a schedule, we'll let you know by email when there's something new to see. Every entry can be checked against the original signed timesheet alongside it. If anything looks wrong, use the Query button next to that entry and we'll get back to you.</p>
      <div class="brief-totals">
        <div class="bt-block">
          <span class="bt-label">Total due, as of ${todayStr}</span>
          <span class="bt-amount bt-amount-due">${fmtMoney(dueAmount)}</span>
        </div>
        <div class="bt-block">
          <span class="bt-label">Total paid so far</span>
          <span class="bt-amount">${fmtMoney(totalPaid)}</span>
        </div>
        <div class="bt-block">
          <span class="bt-label">Total, all time</span>
          <span class="bt-amount">${fmtMoney(allTimeAmount)}</span>
          <span class="bt-sub">${allTimeHours} hours &times; ${fmtMoney(RATE)}/hr</span>
        </div>
      </div>
      <div class="brief-meta">Most recent approved date: ${latest} &middot; Ground Worker rate: ${fmtMoney(RATE)}/hr</div>
    </div>`;
}

function renderOverview(main) {
  const byJob = {};
  entries.forEach(e => { (byJob[baseJob(e.site)] = byJob[baseJob(e.site)] || []).push(e); });

  let html = briefHtml();

  if (!entries.length) {
    html += '<p class="empty-state">No approved hours yet — check back soon.</p>';
    main.innerHTML = html;
    return;
  }

  const grandTotal = entries.reduce((s, e) => s + (e.hours || 0), 0);

  Object.keys(byJob).sort().forEach(job => {
    const jrows = byJob[job];
    const byName = {};
    jrows.forEach(e => { (byName[e.name || '(Unnamed)'] = byName[e.name || '(Unnamed)'] || []).push(e); });
    const jobHours = jrows.reduce((s, r) => s + (r.hours || 0), 0);
    html += `
      <div class="overview-section">
        <div class="overview-hdr">${esc(job)}<span class="oh-hours">${jobHours} hours &middot; ${fmtMoney(jobHours * RATE)}</span></div>
        <table class="overview-table">
          <colgroup><col style="width:30%"><col style="width:24%"><col style="width:16%"><col style="width:15%"><col style="width:15%"></colgroup>
          <thead><tr><th>Name</th><th>Date range</th><th>Hours</th><th>Rate</th><th>Amount</th></tr></thead>
          <tbody>`;
    Object.keys(byName).sort().forEach(name => {
      const rs = byName[name];
      const hrs = rs.reduce((s, r) => s + (r.hours || 0), 0);
      const nDates = rs.map(r => r.date).filter(Boolean).sort();
      const range = nDates.length ? fmtDate(nDates[0]) + ' – ' + fmtDate(nDates[nDates.length - 1]) : '—';
      html += `
            <tr class="overview-row" data-job="${esc(job)}" data-name="${esc(name)}">
              <td>${esc(name)}</td>
              <td>${range}</td>
              <td>${hrs}h</td>
              <td>${fmtMoney(RATE)}</td>
              <td class="or-amount">${fmtMoney(hrs * RATE)}</td>
            </tr>`;
    });
    html += `</tbody></table></div>`;
  });

  html += `
    <table class="overview-table overview-total-table">
      <colgroup><col style="width:30%"><col style="width:24%"><col style="width:16%"><col style="width:15%"><col style="width:15%"></colgroup>
      <tbody><tr class="overview-total-row"><td colspan="2">Total</td><td>${grandTotal}h</td><td></td><td class="or-amount">${fmtMoney(grandTotal * RATE)}</td></tr></tbody>
    </table>`;

  main.innerHTML = html;
  main.querySelectorAll('.overview-row').forEach(row => {
    row.addEventListener('click', () => {
      state.job = row.dataset.job; state.name = row.dataset.name; state.weekIndex = 0; render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

function renderPerson(main) {
  const rows = entries.filter(e => baseJob(e.site) === state.job && (e.name || '(Unnamed)') === state.name);
  const byWeek = {};
  rows.forEach(e => { const wk = getMonday(e.date); (byWeek[wk] = byWeek[wk] || []).push(e); });
  const weekKeys = Object.keys(byWeek).sort();
  if (state.weekIndex >= weekKeys.length) state.weekIndex = weekKeys.length - 1;
  if (state.weekIndex < 0) state.weekIndex = 0;
  const wk = weekKeys[state.weekIndex];
  const weekRows = (byWeek[wk] || []).sort((a, b) => a.date.localeCompare(b.date));
  const weekTotal = weekRows.reduce((s, r) => s + (r.hours || 0), 0);
  const personTotal = rows.reduce((s, r) => s + (r.hours || 0), 0);
  const dates = rows.map(r => r.date).filter(Boolean).sort();
  const images = [...new Set(weekRows.map(r => r.image))];
  const approvedBy = weekRows.find(r => r.approvedBy) ;

  let html = `
    <button class="back-inline" id="backToList">&#8592; Back to list</button>
    <div class="person-head">
      <h2>${esc(state.name)}</h2>
      <div class="ph-range">${esc(state.job)} &middot; ${dates.length ? fmtDate(dates[0]) + ' – ' + fmtDate(dates[dates.length - 1]) : '—'}</div>
      <div class="ph-total">Total: ${personTotal}h &middot; ${fmtMoney(personTotal * RATE)}</div>
    </div>
    <div class="week-nav">
      <button id="wkPrev" ${state.weekIndex <= 0 ? 'disabled' : ''}>&lsaquo; Previous week</button>
      <div class="wn-label">Week of ${fmtDate(wk)} (${state.weekIndex + 1} of ${weekKeys.length}) — ${weekTotal}h &middot; ${fmtMoney(weekTotal * RATE)}</div>
      <button id="wkNext" ${state.weekIndex >= weekKeys.length - 1 ? 'disabled' : ''}>Next week &rsaquo;</button>
    </div>
    <div class="week-grid">
      <div>
        <table class="hrs-table">
          <colgroup><col style="width:26%"><col style="width:14%"><col style="width:14%"><col style="width:12%"><col style="width:34%"></colgroup>
          <thead><tr><th>Date</th><th>Start</th><th>Finish</th><th>Hours</th><th>Description</th></tr></thead>
          <tbody>
            ${weekRows.map(r => `
              <tr data-row-id="${esc(r.id)}">
                <td>${fmtDate(r.date)}</td><td>${esc(r.start)}</td><td>${esc(r.finish)}</td><td>${r.hours}h</td><td>${esc(r.description) || '—'}</td>
              </tr>
              <tr><td colspan="5" class="day-actions"><button class="btn-query" data-query-btn data-id="${esc(r.id)}" data-name="${esc(r.name)}" data-date="${esc(r.date)}" data-area="${esc(jobDescription(r.site))}">&#9888; Query these hours</button><div class="query-slot" data-query-slot="${esc(r.id)}"></div></td></tr>
            `).join('')}
            <tr class="hrs-total-row"><td colspan="3">Week total</td><td>${weekTotal}h</td><td>${fmtMoney(weekTotal * RATE)}</td></tr>
          </tbody>
        </table>
        <div class="approved-note">${approvedBy ? `<strong>&#10003; Approved</strong> by ${esc(approvedBy.approvedBy)}${approvedBy.approvedAt ? ' on ' + new Date(approvedBy.approvedAt).toLocaleDateString('en-GB') : ''}` : ''}</div>
      </div>
      <div class="week-photos">
        ${images.map(img => `<img src="${img}" alt="Original timesheet photo">`).join('')}
      </div>
    </div>`;
  main.innerHTML = html;

  document.getElementById('backToList').addEventListener('click', () => { state.name = null; state.job = null; render(); window.scrollTo({top:0}); });
  document.getElementById('wkPrev').addEventListener('click', () => { state.weekIndex--; render(); });
  document.getElementById('wkNext').addEventListener('click', () => { state.weekIndex++; render(); });
  main.querySelectorAll('[data-query-btn]').forEach(btn => {
    btn.addEventListener('click', () => openQueryForm(btn.dataset));
  });
}

function openQueryForm(d) {
  const slot = document.querySelector(`[data-query-slot="${d.id}"]`);
  if (!slot || slot.dataset.open) return;
  slot.dataset.open = '1';
  slot.innerHTML = `
    <div class="query-form">
      <label>Name<input type="text" data-qf-name value="${esc(d.name)}" readonly></label>
      <label>Date<input type="text" data-qf-date value="${fmtDate(d.date)}" readonly></label>
      <label>Area / Job<input type="text" data-qf-area value="${esc(d.area)}" readonly></label>
      <label>What's the issue?<textarea data-qf-message placeholder="e.g. hours look too high, wrong description, wrong person…"></textarea></label>
      <div class="qf-actions">
        <button class="btn-primary" data-qf-submit>Submit query</button>
        <button class="btn-secondary" data-qf-cancel>Cancel</button>
      </div>
      <div class="qf-status" data-qf-status></div>
    </div>`;
  slot.querySelector('[data-qf-cancel]').addEventListener('click', () => { slot.innerHTML = ''; delete slot.dataset.open; });
  slot.querySelector('[data-qf-submit]').addEventListener('click', async () => {
    const message = slot.querySelector('[data-qf-message]').value.trim();
    const status = slot.querySelector('[data-qf-status]');
    if (!message) { status.style.color = 'var(--red)'; status.textContent = 'Please describe the issue first.'; return; }
    const btn = slot.querySelector('[data-qf-submit]');
    btn.disabled = true; status.style.color = 'var(--muted)'; status.textContent = 'Submitting…';
    try {
      const r = await fetch(QUERIES_REST, {
        method: 'POST',
        headers: sbHeaders({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
        body: JSON.stringify({ staff_name: d.name, work_date: d.date, site: d.area, description: d.name, message, resolved: false })
      });
      if (!r.ok) throw new Error(await r.text());
      slot.innerHTML = '<div class="query-form" style="color:var(--green);font-weight:700">&#10003; Query submitted — DGC will get back to you.</div>';
    } catch (err) {
      btn.disabled = false; status.style.color = 'var(--red)'; status.textContent = 'Could not submit: ' + err.message;
    }
  });
}

(async function boot() {
  try {
    await loadEntries();
    render();
  } catch (err) {
    document.getElementById('mainArea').innerHTML = briefHtml() +
      `<p class="empty-state">Couldn't load hours right now.<br><span style="font-size:0.75rem;color:var(--red)">${esc(err.message)}</span></p>`;
  }
})();
</script>
<div class="footer-note">Drainage &amp; Groundwork Contractors Limited &middot; Registered in the Isle of Man</div>
</body>
</html>
